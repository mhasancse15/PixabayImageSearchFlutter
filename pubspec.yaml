name: pixabay_image_search
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.9
  # State management, dependency injection & routing
  get: ^4.7.3
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Networking
  dio: ^5.11.1
  pretty_dio_logger: ^1.4.0

  # Functional error handling (Either / Failure pattern)
  dartz: ^0.10.1

  # Value equality for entities & models
  equatable: ^2.1.0

  # Environment configuration (API key)
  flutter_dotenv: ^6.0.1

  # Image loading & caching
  cached_network_image: ^4.0.0

  # Local key-value cache (search history, simple caching)
  get_storage: ^2.1.1

  # Connectivity check for NetworkInfo
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  build_runner: ^2.16.1
  injectable_generator: ^3.1.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets:
    - .env